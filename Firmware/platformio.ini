; PlatformIO Project Configuration
; TRX 27 MHz — плата управления (STM32F411CEU6, тактирование от HSI — без HSE)

[platformio]
default_envs = genericSTM32F411CE

; board = genericSTM32F411CE — STM32F411CEU6 без внешнего кварца:
;   * HSI 16 МГц → PLL → 96 МГц (SYSCLK) + 48 МГц (USB, PLLQ=8);
;   * отказ от HSE 25 МГц BlackPill → generic не привязан к HSE;
;   * upload — DFU (ROM bootloader, работает от HSI независимо от кварца).
[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
framework = arduino
upload_protocol = dfu
monitor_speed = 115200

build_flags =
    -D USBCON
    -D USBD_USE_CDC

lib_deps =
    adafruit/Adafruit Si5351 Library @ ^1.6.0
    moononournation/GFX Library for Arduino @ ^1.6.9
