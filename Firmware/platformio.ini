; PlatformIO Project Configuration
; TRX 27 MHz — плата управления

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
build_flags =
    -D HAL_TIM_MODULE_ENABLED
    -D USBCON
    -D USBD_USE_CDC
lib_deps =
    ; adafruit/Adafruit Si5351 Library
    ; olikraus/U8g2